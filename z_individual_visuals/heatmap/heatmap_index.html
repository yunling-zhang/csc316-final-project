<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collisions by Weekday × Year</title>

  <link rel="stylesheet" href="css/heatmap_styles.css" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://d3js.org/d3-scale-chromatic.v1.min.js"></script>
</head>

<body>
  <main class="container">
    <header>
      <h1>Collisions by Weekday × Year</h1>
      <p>Heatmap overlayed on the car interior, showing collisions by weekday and year.</p>
    </header>

    <!-- Car background with floating heatmap panel -->
    <section class="car-section">
      <img src="img/car_background.png"
           alt="Car dashboard with heatmap overlay"
           class="car-fullwidth">

      <div class="heatmap-floating-panel">
        <div id="heatmap" class="chart"></div>
      </div>
    </section>

    <!-- Controls + legend below the car -->
    <section class="controls-section">
      <div id="year-range" class="year-range"></div>
      <div id="legend" class="legend"></div>
    </section>

    <footer>
      <p>
        Source: <code>data/collisions_by_weekday_cleaned.csv</code>. Hover cells for details.
      </p>
    </footer>
  </main>

  <script src="js/calendar-heatmap.js"></script>
</body>

</html>
